name: JavaScript Next.js Application

on:
  [push]

permissions:
      id-token: write
      contents: read

env:
  AZURE_WEBAPP_NAME: site-next-pycidcd-dev1 # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: './src/next-app' # Set this to the path to your web app project, defaults to the repository root

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install
      working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Build optimized production app
      run: |
        npm run build
      working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
      env:
        NODE_ENV: production

    - name: Prune to production dependencies
      run: npm prune --omit=dev
      working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Debug file listing before Azure deploy
      run: |
        echo "Working directory: $(pwd)"
        echo "Repository file list:"
        find . -type f | sort
    
    - uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Deploy web App using GH Action azure/webapps-deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    
    - name: logout
      run: |
        az logout
