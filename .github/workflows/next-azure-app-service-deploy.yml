name: JavaScript Next.js Application

on:
  [push]

permissions:
      id-token: write
      contents: read

env:
  AZURE_WEBAPP_NAME: site-next-pycidcd-dev1 # Set this to your application's name
  AZURE_WEBAPP_BUILD_PATH: './src/next-app' # Build path for Next.js app
  AZURE_WEBAPP_PACKAGE_PATH: './src/next-app/.next/standalone' # Deploy only the standalone output

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install
      working-directory: ${{ env.AZURE_WEBAPP_BUILD_PATH }}

    - name: Build optimized production app
      run: |
        npm run build
      working-directory: ${{ env.AZURE_WEBAPP_BUILD_PATH }}
      env:
        NODE_ENV: production

    - name: Add static assets to standalone output
      run: |
        mkdir -p .next/standalone/.next
        cp -r .next/static .next/standalone/.next/static
        if [ -d "public" ]; then
          cp -r public .next/standalone/public
        fi
      working-directory: ${{ env.AZURE_WEBAPP_BUILD_PATH }}
    
    - uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Deploy web App using GH Action azure/webapps-deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    
    - name: logout
      run: |
        az logout
