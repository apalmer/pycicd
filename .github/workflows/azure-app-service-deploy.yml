name: Deploy Django ASGI app to Azure App Service

on:
  push:
  workflow_dispatch:

permissions:
      id-token: write
      contents: read

env:
  AZURE_WEBAPP_NAME: site-django-pycidcd-dev1 # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: './src/django-app' # Set this to the path to your web app project, defaults to the repository root
  PYTHON_VERSION: '3.14'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d 
      with:
        version: "latest"
        # Automatically caches the uv package store between CI runs
        enable-cache: true
        cache-dependency-glob: src/django-app/uv.lock

    - name: Validate dependencies and Django config
      working-directory: src/django-app
      run: |
        uv sync --frozen --no-dev
        uv run python manage.py check --deploy

    - name: Deploy web App using GH Action azure/webapps-deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        startup-command: bash startup.sh
    
    - name: logout
      run: |
        az logout
