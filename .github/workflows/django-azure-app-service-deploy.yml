name: Python Django Application

on:
  [push]

permissions:
      id-token: write
      contents: read

env:
  AZURE_WEBAPP_NAME: site-django-pycidcd-dev1 # Set this to your application's name
  AZURE_WEBAPP_PACKAGE_PATH: './src/django-app' # Set this to the path to your web app project, defaults to the repository root

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Build antenv for Azure deployment
      run: |
        UV_PROJECT_ENVIRONMENT=antenv uv sync --python 3.14 --no-dev --frozen
      working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

    - name: Export requirements.txt from pyproject.toml
      run: |
        uv pip compile pyproject.toml -o requirements.txt
      working-directory: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    
    - uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Deploy web App using GH Action azure/webapps-deploy
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    
    - name: logout
      run: |
        az logout
